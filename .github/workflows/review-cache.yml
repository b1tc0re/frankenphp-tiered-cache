name: Review cache core

on:
  push:
    branches:
      - refactor/post-memory-cleanup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test cache packages
        run: go test ./internal/...
      - name: Race test cache packages
        run: go test -race ./internal/...
      - name: Vet cache packages
        run: go vet ./internal/...
      - name: Redis Pub/Sub integration
        env:
          REDIS_ADDR: 127.0.0.1:6379
        run: go test -count=1 -run '^TestTieredCacheRedisPubSubIntegration$' ./internal/cache/tiered
