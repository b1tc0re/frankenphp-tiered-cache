name: Review cache core

on:
  push:
    branches:
      - refactor/post-memory-cleanup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test cache packages
        run: go test ./internal/...
      - name: Race test cache packages
        run: go test -race ./internal/...
      - name: Vet cache packages
        run: go vet ./internal/...
